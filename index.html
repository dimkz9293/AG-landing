<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome | Simple Landing Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #2d3748;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 48px 36px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 440px;
      width: 100%;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1a202c;
    }

    p {
      color: #718096;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .btn-hi {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      border: none;
      padding: 14px 40px;
      font-size: 1.125rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(118, 75, 162, 0.35);
      transition: all 0.2s ease;
    }

    .btn-hi:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 20px rgba(118, 75, 162, 0.45);
    }

    .btn-hi:active {
      transform: translateY(0) scale(0.98);
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #ffffff;
      padding: 32px 28px;
      border-radius: 18px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      transform: scale(0.9) translateY(10px);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-content {
      transform: scale(1) translateY(0);
    }

    .emoji-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      display: inline-block;
      animation: wave 1.2s infinite ease-in-out;
      transform-origin: 70% 70%;
    }

    @keyframes wave {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(14deg); }
      40% { transform: rotate(-8deg); }
      60% { transform: rotate(14deg); }
      80% { transform: rotate(-4deg); }
      100% { transform: rotate(0deg); }
    }

    .modal-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .modal-message {
      font-size: 1rem;
      color: #4a5568;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-close {
      background: #edf2f7;
      color: #2d3748;
      border: none;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-close:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Welcome!</h1>
    <p>A simple landing page demo. Click the button below to say hi.</p>
    <button id="hiBtn" class="btn-hi">Hi</button>
  </div>

  <!-- Popup Modal -->
  <div id="popupModal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <div class="emoji-icon">👋</div>
      <h2 class="modal-title">Hello!</h2>
      <p class="modal-message">Thanks for stopping by! Hope you're having a wonderful day.</p>
      <button id="closeBtn" class="btn-close">Close</button>
    </div>
  </div>

  <script>
    const hiBtn = document.getElementById('hiBtn');
    const popupModal = document.getElementById('popupModal');
    const closeBtn = document.getElementById('closeBtn');

    function openModal() {
      popupModal.classList.add('active');
      popupModal.setAttribute('aria-hidden', 'false');
      closeBtn.focus();
    }

    function closeModal() {
      popupModal.classList.remove('active');
      popupModal.setAttribute('aria-hidden', 'true');
      hiBtn.focus();
    }

    hiBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);

    // Close when clicking outside modal content
    popupModal.addEventListener('click', (e) => {
      if (e.target === popupModal) {
        closeModal();
      }
    });

    // Close on Escape key press
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && popupModal.classList.contains('active')) {
        closeModal();
      }
    });
  </script>

</body>
</html>
